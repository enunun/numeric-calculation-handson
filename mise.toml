[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
julia = "1.12.7"
# 版を変えたら`mise lock`を実行し，更新されたmise.lockもコミットする．

[settings]
lockfile = true

[tasks.install]
description = "依存パッケージ(Markdownのリント)をインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.lint]
description = "Markdownのリントと，設計文書の検査をまとめて実行する"
depends = ["lint:markdown", "design"]

[tasks."lint:markdown"]
description = "Markdownの文章(textlint)と書式(markdownlint)を検査する"
depends = ["install"]
run = "pnpm lint"

[tasks.design]
description = "設計文書を検査する(図の構文，依存図とコードの照合，誤差仕様書と公開APIの照合)．引数でパッケージを指定できる"
usage = 'arg "[package]..." help="検査するパッケージのディレクトリ．省略するとすべての模範解答と演習(Iteration 0の演習を除く)"'
run = "julia --startup-file=no scripts/check_design.jl ${usage_package:-}"

[tasks.test]
description = "すべての模範解答と演習のパッケージのテストを実行する"
run = "julia --startup-file=no scripts/test_all.jl"

[tasks."test:package"]
description = "指定したパッケージのテストを実行する(例: mise run test:package iterations/iteration-0/exercise)"
usage = 'arg "<package>" help="テストするパッケージのディレクトリ"'
run = "julia --startup-file=no --project=\"$usage_package\" -e 'using Pkg; Pkg.test()'"

[tasks.repl]
description = "指定したパッケージを有効にしてJuliaのREPLを起動する(例: mise run repl iterations/iteration-0/exercise)"
usage = 'arg "<package>" help="有効にするパッケージのディレクトリ"'
raw = true
run = "julia --project=\"$usage_package\""

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "リント，設計文書の検査，すべてのテストをまとめて実行する(CIと同じ)"
depends = ["lint", "test"]
